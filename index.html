<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年级科学练习</title>
<style>
  :root { --ink:#1c2430; --line:#d7deea; --bg:#f4f7fb; --card:#fff; --ok:#137a3a; --bad:#b42318; --btn:#1d4e89; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#1d4e89; color:#fff; padding:20px 16px 16px; }
  header h1 { margin:0 0 6px; font-size:1.45rem; }
  header p { margin:0; opacity:.92; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 14px; }
  .q h2 { margin:0 0 10px; font-size:1.05rem; line-height:1.45; }
  .tag { display:inline-block; font-size:.8rem; background:#e8f0fa; color:#1d4e89; border-radius:999px; padding:2px 8px; margin-bottom:8px; }
  label.opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; cursor:pointer; }
  label.opt:has(input:checked) { border-color:#1d4e89; background:#f3f8ff; }
  .q.right { border-color:#8dcea6; }
  .q.wrong { border-color:#f0b4ae; }
  .mark { margin-top:8px; font-weight:700; }
  .mark.ok { color:var(--ok); }
  .mark.bad { color:var(--bad); }
  button { font:inherit; border:0; border-radius:12px; padding:14px 18px; background:var(--btn); color:#fff; width:100%; }
  button.ghost { background:#fff; color:var(--btn); border:1px solid var(--btn); margin-top:8px; }
  #score { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid var(--line); }
  #score strong { font-size:1.6rem; }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <h1>二年级科学练习</h1>
  <p>第5–9课：植物、光和暗、电、混合物、地球。做完按「看成绩」。</p>
</header>
<main>
  <form id="quiz"></form>
  <div id="score" class="hide"></div>
  <button id="check" type="button">看成绩</button>
  <button id="again" class="ghost hide" type="button">再做一次</button>
</main>
<script>
const questions = [
  { topic:"溶解", prompt:"两杯水放进同样多的糖，用同样的速度搅拌。哪一杯溶得比较快？", options:["冷水那一杯","热水那一杯","两杯一样快"], answer:[1] },
  { topic:"溶解", prompt:"上面这个实验里，影响糖溶解快慢的是水的什么？", options:["颜色","温度","杯子的价钱"], answer:[1] },
  { topic:"溶解", prompt:"哪些做法会让物质溶得更快？可以选多于一个。", multi:true, options:["搅拌","把物质弄碎","看物质贵不贵"], answer:[0,1] },
  { topic:"溶解", prompt:"可以用咖喱粉代替糖，来做「会不会溶解」的实验吗？", options:["可以，因为咖喱粉也会溶解","不可以，因为咖喱粉放进水里还看得到颗粒","可以，因为咖喱粉是甜的"], answer:[1] },
  { topic:"水循环", prompt:"哪一个次序是对的？", options:["水 → 水蒸气 → 云 → 雨","云 → 水 → 雨 → 水蒸气","雨 → 水蒸气 → 水 → 云"], answer:[0] },
  { topic:"水循环", prompt:"哪些说明是对的？可以选多于一个。", multi:true, options:["水受热会变成水蒸气，升到空中","水蒸气聚在一起会形成云","雨落下后，不会再流回河里或海里"], answer:[0,1] },
  { topic:"光", prompt:"哪些会自己发光，是光源？可以选多于一个。", multi:true, options:["太阳","月亮","手电筒","蜡烛","镜子"], answer:[0,2,3] },
  { topic:"光", prompt:"要把线穿过小针孔，哪一种情况比较快？", options:["光线亮的时候","很黑暗的时候","两种一样快"], answer:[0], why:"光亮时比较容易看清楚，活动也比较容易进行。" },
  { topic:"光", prompt:"什么时候会有影子？", options:["完全没有光","光被物体挡住","物体是完全透明的"], answer:[1] },
  { topic:"光", prompt:"用手电筒照杯子。影子从最清楚排到最模糊，哪一个对？", options:["陶瓷杯 → 毛玻璃杯 → 透明玻璃杯","透明玻璃杯 → 陶瓷杯 → 毛玻璃杯","毛玻璃杯 → 透明玻璃杯 → 陶瓷杯"], answer:[0], why:"陶瓷杯挡光，影子清楚；毛玻璃只让一部分光透过；透明玻璃几乎让光透过。" },
  { topic:"电", prompt:"一个完整电路要有哪些？可以选多于一个。", multi:true, options:["干电池","灯泡","开关","电线","磁铁"], answer:[0,1,2,3] },
  { topic:"电", prompt:"灯泡在电路里主要做什么？", options:["接通或截断电路","发出光亮","把元件连接起来"], answer:[1] },
  { topic:"电", prompt:"开关在电路里主要做什么？", options:["接通或截断电路","发出光亮","提供电流"], answer:[0] },
  { topic:"电", prompt:"电线在电路里主要做什么？", options:["发出光亮","提供电流","把元件连接起来"], answer:[2] },
  { topic:"混合物", prompt:"芝麻沉在杯底的水里。最好用什么分开？", options:["滤纸","磁铁","蒸发"], answer:[0] },
  { topic:"混合物", prompt:"面粉里混了绿豆。最好用什么分开？", options:["漂浮法","筛子","蒸发"], answer:[1] },
  { topic:"混合物", prompt:"土壤里有回形针。最好用什么分开？", options:["用磁铁","蒸发","漂浮法"], answer:[0] },
  { topic:"混合物", prompt:"盐溶在水里了。要取回盐，最好用什么？", options:["用筛子","蒸发","用磁铁"], answer:[1] },
  { topic:"混合物", prompt:"橡皮和铅笔混在一起。最好用什么分开？", options:["用手捡","蒸发","用筛子"], answer:[0] },
  { topic:"混合物", prompt:"枯叶和土壤混在一起，放进水里。最好用什么分开？", options:["蒸发","漂浮法，枯叶浮起来","用磁铁"], answer:[1] },
  { topic:"地球", prompt:"哪些是天然水源？可以选多于一个。", multi:true, options:["海","河流","湖泊","水井","雨","泉眼"], answer:[0,1,2,4,5], why:"水井是人挖的，不是天然水源。" },
  { topic:"地球", prompt:"海水为什么不适合直接喝？", options:["因为海水是咸的","因为海水不会流动","因为海水没有颜色"], answer:[0] },
  { topic:"植物与空气", prompt:"鱼能在水里活着，主要是因为什么？", options:["水里完全没有空气","水的空隙里有空气","鱼不需要呼吸"], answer:[1] },
  { topic:"植物", prompt:"种子发芽一定需要哪一组？", options:["水、空气、适宜温度","油、冰块、阳光","盐、沙、磁铁"], answer:[0] }
];

const form = document.getElementById("quiz");
const scoreBox = document.getElementById("score");
const checkBtn = document.getElementById("check");
const againBtn = document.getElementById("again");

function render() {
  form.innerHTML = "";
  scoreBox.classList.add("hide");
  againBtn.classList.add("hide");
  checkBtn.classList.remove("hide");
  questions.forEach((q, i) => {
    const box = document.createElement("section");
    box.className = "q";
    box.dataset.i = i;
    const type = q.multi ? "checkbox" : "radio";
    box.innerHTML = `<div class="tag">${q.topic}</div><h2>${i + 1}. ${q.prompt}</h2>` +
      q.options.map((opt, j) => `<label class="opt"><input type="${type}" name="q${i}" value="${j}"> <span>${opt}</span></label>`).join("") +
      `<div class="mark"></div>`;
    form.appendChild(box);
  });
}

function chosen(i) {
  return [...form.querySelectorAll(`input[name="q${i}"]:checked`)].map(el => Number(el.value)).sort((a,b)=>a-b);
}

function same(a, b) {
  return a.length === b.length && a.every((n, i) => n === b[i]);
}

checkBtn.onclick = () => {
  let ok = 0;
  questions.forEach((q, i) => {
    const box = form.querySelector(`[data-i="${i}"]`);
    const got = chosen(i);
    const right = same(got, q.answer);
    if (right) ok++;
    box.classList.remove("right","wrong");
    box.classList.add(right ? "right" : "wrong");
    const ans = q.answer.map(n => q.options[n]).join("、");
    const mark = box.querySelector(".mark");
    mark.className = "mark " + (right ? "ok" : "bad");
    mark.textContent = right ? "对" : `错。正确答案：${ans}${q.why ? " " + q.why : ""}`;
  });
  scoreBox.classList.remove("hide");
  scoreBox.innerHTML = `<strong>${ok} / ${questions.length}</strong><p>${ok === questions.length ? "全部对了。" : "红色是错的，看一下正确答案。"}</p>`;
  scoreBox.scrollIntoView({behavior:"smooth"});
  againBtn.classList.remove("hide");
};

againBtn.onclick = () => { render(); window.scrollTo({top:0, behavior:"smooth"}); };
render();
</script>
</body>
</html>
