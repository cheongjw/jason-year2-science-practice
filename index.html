<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年级科学练习</title>
<style>
  :root { --ink:#1c2430; --line:#d7deea; --bg:#f4f7fb; --card:#fff; --ok:#137a3a; --bad:#b42318; --btn:#1d4e89; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#1d4e89; color:#fff; padding:20px 16px 16px; }
  header h1 { margin:0 0 6px; font-size:1.45rem; }
  header p { margin:0; opacity:.92; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 14px; }
  .q h2 { margin:0 0 10px; font-size:1.05rem; line-height:1.45; }
  .tag { display:inline-block; font-size:.8rem; background:#e8f0fa; color:#1d4e89; border-radius:999px; padding:2px 8px; margin-bottom:8px; }
  label.opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; cursor:pointer; }
  label.opt:has(input:checked) { border-color:#1d4e89; background:#f3f8ff; }
  .q.right { border-color:#8dcea6; }
  .q.wrong { border-color:#f0b4ae; }
  .mark { margin-top:8px; font-weight:700; }
  .mark.ok { color:var(--ok); }
  .mark.bad { color:var(--bad); }
  button { font:inherit; border:0; border-radius:12px; padding:14px 18px; background:var(--btn); color:#fff; width:100%; }
  button.ghost { background:#fff; color:var(--btn); border:1px solid var(--btn); margin-top:8px; }
  nav { display:flex; gap:8px; margin:0 0 14px; }
  nav button { width:auto; flex:1; background:#fff; color:var(--btn); border:1px solid var(--btn); }
  nav button.on { background:var(--btn); color:#fff; }
  #score { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; border:1px solid var(--line); }
  #score strong { font-size:1.6rem; }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <h1>二年级科学练习</h1>
  <p>第5–9课：植物、光和暗、电、混合物、地球。做完按「看成绩」。</p>
</header>
<main>
  <nav>
    <button type="button" id="set50" class="on">50题</button>
    <button type="button" id="set1">练习一</button>
    <button type="button" id="set2">练习二</button>
  </nav>
  <form id="quiz"></form>
  <div id="score" class="hide"></div>
  <button id="check" type="button">看成绩</button>
  <button id="again" class="ghost hide" type="button">再做一次</button>
</main>

];

let current = "50题";
const form = document.getElementById("quiz");
const scoreBox = document.getElementById("score");
const checkBtn = document.getElementById("check");
const againBtn = document.getElementById("again");

function questions() { return sets[current]; }

function render() {
  form.innerHTML = "";
  scoreBox.classList.add("hide");
  againBtn.classList.add("hide");
  checkBtn.classList.remove("hide");
  document.getElementById("set50").classList.toggle("on", current === "50题");
  document.getElementById("set1").classList.toggle("on", current === "练习一");
  document.getElementById("set2").classList.toggle("on", current === "练习二");
  questions().forEach((q, i) => {
    const box = document.createElement("section");
    box.className = "q";
    box.dataset.i = i;
    const type = q.multi ? "checkbox" : "radio";
    box.innerHTML = `<div class="tag">${q.topic}</div><h2>${i + 1}. ${q.prompt}</h2>` +
      q.options.map((opt, j) => `<label class="opt"><input type="${type}" name="q${i}" value="${j}"> <span>${opt}</span></label>`).join("") +
      `<div class="mark"></div>`;
    form.appendChild(box);
  });
}

function chosen(i) {
  return [...form.querySelectorAll(`input[name="q${i}"]:checked`)].map(el => Number(el.value)).sort((a,b)=>a-b);
}

function same(a, b) {
  return a.length === b.length && a.every((n, i) => n === b[i]);
}

checkBtn.onclick = () => {
  let ok = 0;
  const list = questions();
  list.forEach((q, i) => {
    const box = form.querySelector(`[data-i="${i}"]`);
    const got = chosen(i);
    const right = same(got, q.answer);
    if (right) ok++;
    box.classList.remove("right","wrong");
    box.classList.add(right ? "right" : "wrong");
    const ans = q.answer.map(n => q.options[n]).join("、");
    const mark = box.querySelector(".mark");
    mark.className = "mark " + (right ? "ok" : "bad");
    mark.textContent = right ? "对" : `错。正确答案：${ans}${q.why ? " " + q.why : ""}`;
  });
  scoreBox.classList.remove("hide");
  scoreBox.innerHTML = `<strong>${ok} / ${list.length}</strong><p>${ok === list.length ? "全部对了。" : "红色是错的，看一下正确答案。"}</p>`;
  scoreBox.scrollIntoView({behavior:"smooth"});
  againBtn.classList.remove("hide");
};

function pick(name) { current = name; render(); window.scrollTo({top:0, behavior:"smooth"}); }
document.getElementById("set50").onclick = () => pick("50题");
document.getElementById("set1").onclick = () => pick("练习一");
document.getElementById("set2").onclick = () => pick("练习二");
againBtn.onclick = () => { render(); window.scrollTo({top:0, behavior:"smooth"}); };
render();
</script>
